<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>PaddleCue — Open Play Queue</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- the app is always dark, so the browser bar matches the header in both schemes -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#10150f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10150f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ============================================================
     Mobile-first pass (MajorMajor phone checklist + Emil Kowalski's
     motion rules): 44px tap targets, press feedback on everything
     tappable, safe areas, 12px+ text for outdoor reading, zoom allowed,
     and motion limited to transform/opacity with two shared curves.
     ============================================================ */
  :root{
    --bg:#10150f; --card:#1b231a; --card2:#242f22; --line:#38463a;
    --ink:#f1f5ee; --dim:#a9b6a2; --accent:#c3f53c; --accent-ink:#1a2404;
    --teamA:#5fd4f5; --teamB:#ffb85c; --danger:#ff7a6e; --win:#8de08a;
    --lv1:#8de08a; --lv2:#f2d65e; --lv3:#ff8fb1;
    --tap:44px;
    --ease-out:cubic-bezier(.23,1,.32,1);       /* enter / exit / press */
    --ease-in-out:cubic-bezier(.77,0,.175,1);   /* things moving on screen */
    --ease-drawer:cubic-bezier(.32,.72,0,1);    /* iOS-like bottom sheet */
    --nav-h:60px;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;}
  /* no pull-to-refresh / rubber-band reload in the middle of a session */
  html,body{margin:0; padding:0; overscroll-behavior:none;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-size:15px; line-height:1.35;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); min-height:100vh; min-height:100dvh;}
  h1,h2,h3{margin:0;}
  h3{font-size:17px;}
  button{font-family:inherit; border:none; border-radius:12px; cursor:pointer; font-size:15px; color:inherit; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease, opacity 150ms ease;}
  /* asymmetric: the press lands fast (100ms), the release settles (160ms) */
  button:active{transform:scale(.97); transition-duration:100ms;}
  button:disabled{opacity:.45; cursor:default;}
  input{font-family:inherit; font-size:16px; background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:0 14px; min-height:48px; outline:none; min-width:0;}
  input:focus{border-color:var(--accent);}
  .wrap{max-width:560px; margin:0 auto; padding:12px 16px;}
  .subtle{color:var(--dim); font-size:13px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
  .btn{background:var(--card2); color:var(--ink); padding:0 16px; min-height:var(--tap); font-weight:600;}
  .btn.big{min-height:52px; font-size:16px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .btn.ghost{background:transparent; color:var(--dim); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--line);}
  .btn.small{min-height:40px; padding:0 12px; font-size:14px; border-radius:10px;}
  .ibtn{width:var(--tap); height:var(--tap); flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--line); border-radius:12px; font-size:18px; color:var(--dim);}
  .ibtn.danger{color:var(--danger);}
  .ibtn.on{border-color:var(--accent); color:var(--accent);}
  .row{display:flex; gap:8px; align-items:center;}
  .row .grow{flex:1;}
  .hint{color:var(--dim); font-size:13px; line-height:1.5; margin-top:10px;}
  .hidden{display:none !important;}
  /* header */
  header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:560px; margin:0 auto;
    padding:max(12px, env(safe-area-inset-top, 0px)) 16px 2px;}
  header.top h1{font-size:21px; letter-spacing:.3px;}
  header.top h1 span{color:var(--accent);}
  .status{font-size:13px; color:var(--dim); text-align:right;}
  .status{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .livebtn{min-height:36px; padding:0 12px; border-radius:99px; border:1px solid var(--accent); background:rgba(195,245,60,.1); color:var(--accent); font-size:13px; font-weight:700;}
  .livebtn.bad{border-color:var(--danger); color:var(--danger); background:rgba(255,122,110,.1);}
  /* bottom tabs */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:#151b14; border-top:1px solid var(--line); display:flex; z-index:20;
    padding:0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));}
  nav.tabs button{flex:1; background:none; color:var(--dim); height:var(--nav-h); font-size:12px; font-weight:600; border-radius:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;}
  nav.tabs button .ic{font-size:20px; line-height:1; filter:grayscale(1); opacity:.7; transition:opacity 150ms ease;}
  nav.tabs button.on{color:var(--accent);}
  nav.tabs button.on .ic{filter:none; opacity:1;}
  nav.tabs button:active{transform:none; opacity:.7;}
  /* court */
  .court{border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden; background:var(--card);}
  .court .head{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--card2);}
  .court .head b{font-size:16px;}
  .court .body{padding:12px;}
  .badge{font-size:12px; font-weight:600; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--dim);}
  .badge.play{color:var(--accent); border-color:var(--accent);}
  .badge.stage{color:var(--teamB); border-color:var(--teamB);}
  .teams{display:flex; align-items:stretch; gap:6px;}
  .team{flex:1; min-width:0; border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:6px; position:relative;}
  .team.a{background:rgba(95,212,245,.08); border:1px solid rgba(95,212,245,.4);}
  .team.b{background:rgba(255,184,92,.08); border:1px solid rgba(255,184,92,.4);}
  .team .tname{font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; text-align:center;}
  .team.a .tname{color:var(--teamA);} .team.b .tname{color:var(--teamB);}
  .vs{align-self:center; color:var(--dim); font-size:12px; font-weight:700;}
  .chip{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 6px; min-height:58px; text-align:center; font-size:16px; font-weight:700;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-y; position:relative; overflow-wrap:anywhere;
    transition:transform 160ms var(--ease-out);}
  .chip.vacant:active{transform:scale(.97); transition-duration:100ms;}
  .chip small{display:block; font-weight:500; color:var(--dim); font-size:12px; margin-top:2px;}
  .chip.sel{outline:3px solid var(--accent); outline-offset:1px;}
  /* Hold-to-drag feedback, in two clear steps:
     1. pressing: the card sinks for exactly the hold time (a built-in countdown)
     2. lifting:  it pops up with a bright outline = "you can move it now" */
  .chip.pressing, .qitem.pressing{transform:scale(.95); opacity:.8; transition:transform 220ms linear, opacity 220ms linear;}
  .chip.lifting{transform:scale(1.06); opacity:1; outline:3px solid var(--accent); outline-offset:2px; border-color:var(--accent); background:#2e3b20;
    transition:transform 180ms var(--ease-out), opacity 120ms ease;}
  .qitem.lifting{transform:scale(1.02); opacity:1; outline:3px solid var(--accent); outline-offset:1px; background:#2e3b20; transition:transform 180ms var(--ease-out), opacity 120ms ease;}
  .qitem{transition:transform 160ms var(--ease-out);}
  /* the courts and queue rows are controls: no text selection or callouts on a long press
     (kept off containers with inputs, where iOS would block typing) */
  .court, .qitem{user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  .chip.drophint{outline:2px dashed var(--accent); outline-offset:1px;}
  .chip.vacant{border-style:dashed; background:transparent; color:var(--dim); font-weight:500; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .dropzone{outline:2px dashed var(--accent); outline-offset:2px; border-radius:16px;}
  .dragghost{position:fixed; left:0; top:0; z-index:99; pointer-events:none; width:150px; background:var(--card2); border:1px solid var(--accent); border-radius:12px; padding:10px; text-align:center; font-weight:700;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.5)); will-change:transform;}
  .dragghost.benchhint{border-color:var(--danger); color:var(--danger);}
  .court .actions{display:flex; gap:8px; margin-top:12px;}
  .court .actions .btn{flex:1; min-height:48px;}
  .court .tip{font-size:12px; color:var(--dim); text-align:center; margin-top:8px;}
  .empty-court{color:var(--dim); font-size:14px; text-align:center; padding:10px 0;}
  .timer{font-variant-numeric:tabular-nums; font-weight:700;}
  /* queue */
  .qitem{display:flex; align-items:center; gap:8px; padding:8px 8px 8px 10px; background:var(--card2); border:1px solid var(--line); border-radius:14px; margin-bottom:8px;}
  .qitem:last-child{margin-bottom:0;}
  .qpos{width:26px; height:26px; border-radius:50%; background:var(--card); color:var(--dim); font-size:13px; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;}
  .qitem.next .qpos{background:var(--accent); color:var(--accent-ink);}
  .qmain{flex:1; min-width:0; padding:4px 0;}
  .qmain[data-chip]{touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  .qline{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .qline b{font-size:16px; overflow-wrap:anywhere;}
  .meta{color:var(--dim); font-size:13px; margin-top:2px;}
  .upnext{border:1.5px solid var(--accent); border-radius:16px; padding:8px; margin:12px 0 4px; background:rgba(195,245,60,.06);}
  .upnext .label{font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:2px 4px 8px;}
  .upnext .label .subtle{font-size:12px; font-weight:500; text-transform:none; letter-spacing:0;}
  .upnext .qitem{border-color:rgba(195,245,60,.35);}
  .waitlabel{font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin:14px 4px 8px;}
  .quickadd{display:flex; gap:8px; margin-top:12px;}
  .quickadd input{flex:1;}
  details.help{margin-top:12px; border-top:1px solid var(--line); padding-top:4px;}
  details.help summary{min-height:var(--tap); display:flex; align-items:center; color:var(--dim); font-size:14px; font-weight:600; cursor:pointer; list-style:none;}
  details.help summary::-webkit-details-marker{display:none;}
  details.help summary::after{content:'▾'; margin-left:6px;}
  details.help[open] summary::after{content:'▴';}
  details.help ul{margin:0; padding-left:18px; color:var(--dim); font-size:13px; line-height:1.6;}
  /* players list */
  .prow{padding:12px 0; border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:none;}
  .prow .top, .prow .bot{display:flex; align-items:center; gap:8px;}
  .prow .bot{margin-top:6px;}
  .prow .who{flex:1; min-width:0;}
  .prow .who b{font-size:16px; overflow-wrap:anywhere;}
  .prow .acts{display:flex; gap:6px;}
  .st{font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap;}
  .st.playing{color:var(--accent); border-color:var(--accent);}
  .st.break{color:var(--teamB); border-color:var(--teamB);}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper .val{min-width:40px; text-align:center; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;}
  .setrow{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px;}
  /* tables (standings) */
  table{width:100%; border-collapse:collapse; font-size:15px;}
  td{padding:10px 4px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .tag{font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap;}
  .tag.zz{color:var(--teamB); border-color:var(--teamB);}
  /* log */
  .match{padding:12px 2px; border-bottom:1px solid var(--line); font-size:15px; line-height:1.45;}
  .match:last-child{border-bottom:none;}
  .match .who{font-weight:700;}
  .match .score{color:var(--accent); font-weight:700;}
  .match .meta{font-size:12px;}
  /* setup */
  .plist{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .ptag{background:var(--card2); border:1px solid var(--line); border-radius:99px; padding:0 4px 0 14px; min-height:var(--tap); font-size:15px; display:flex; gap:8px; align-items:center; cursor:pointer;
    user-select:none; -webkit-user-select:none; transition:transform 160ms var(--ease-out);}
  .ptag:active{transform:scale(.97);}
  .ptag b{font-weight:600;}
  .ptag .x{width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; color:var(--danger); font-weight:700; border-radius:50%;}
  label.lbl{display:block; color:var(--dim); font-size:14px; margin:16px 0 6px;}
  /* levels */
  .lvb{display:inline-flex; align-items:center; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim); background:transparent; white-space:nowrap;}
  button.lvb{min-height:36px; padding:0 12px; font-size:13px;}
  .lvb.lv1{color:var(--lv1); border-color:var(--lv1);}
  .lvb.lv2{color:var(--lv2); border-color:var(--lv2);}
  .lvb.lv3{color:var(--lv3); border-color:var(--lv3);}
  .lvl{font-weight:700;} .lvl.lv1{color:var(--lv1);} .lvl.lv2{color:var(--lv2);} .lvl.lv3{color:var(--lv3);}
  .toggle{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; background:var(--card2); padding:12px 14px; text-align:left; min-height:var(--tap);}
  .toggle .sw{width:44px; height:26px; border-radius:99px; background:var(--line); position:relative; flex-shrink:0; transition:background-color 160ms ease;}
  .toggle .sw::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--ink); transition:transform 160ms var(--ease-out), background-color 160ms ease;}
  .toggle.on .sw{background:var(--accent);} .toggle.on .sw::after{transform:translateX(18px); background:var(--accent-ink);}
  /* modal (bottom sheet on phones) */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fade 180ms ease;}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:20px 16px calc(16px + env(safe-area-inset-bottom, 0px)); width:100%; max-width:480px;
    max-height:85vh; max-height:85dvh; overflow:auto; overscroll-behavior:contain; animation:sheetup 260ms var(--ease-drawer);}
  /* exit is quicker than entry: the system response snaps */
  .overlay.closing{animation:fadeout 150ms ease forwards; pointer-events:none;}
  .overlay.closing .modal{animation:sheetdown 180ms var(--ease-out) forwards;}
  @media (min-width:600px){ .overlay{align-items:center; padding:20px;} .modal{border-radius:20px; animation:pop 200ms var(--ease-out);}
    .overlay.closing .modal{animation:popout 150ms var(--ease-out) forwards;} }
  .modal h3{margin-bottom:4px;}
  .fteams{display:flex; gap:10px; margin:16px 0 12px;}
  .fteam{flex:1; min-width:0; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; transition:opacity 150ms ease;}
  .fteam.a{background:rgba(95,212,245,.08); border:1px solid rgba(95,212,245,.45);}
  .fteam.b{background:rgba(255,184,92,.08); border:1px solid rgba(255,184,92,.45);}
  .fteam .names{font-weight:700; text-align:center; min-height:40px; display:flex; align-items:center; justify-content:center; overflow-wrap:anywhere;}
  .fteam input{width:100%; text-align:center; font-size:26px; font-weight:700; min-height:56px;}
  .fteam .btn{min-height:52px; font-weight:700;}
  .fteam.a .btn{background:rgba(95,212,245,.18); color:var(--teamA);}
  .fteam.b .btn{background:rgba(255,184,92,.18); color:var(--teamB);}
  .fteam.lead .btn{outline:2px solid currentColor;}
  .fteam.trail{opacity:.55;}
  /* toast */
  .toast{position:fixed; left:0; right:0; margin:0 auto; width:fit-content; max-width:calc(100% - 32px); bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
    background:var(--card2); border:1px solid var(--line); color:var(--ink); padding:12px 18px; border-radius:16px; font-size:14px; text-align:center; z-index:60;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.4)); pointer-events:none;
    /* transitions, not keyframes: a new toast mid-animation retargets instead of restarting */
    opacity:0; transform:translateY(8px); transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out);}
  .toast.show{opacity:1; transform:none;}
  /* finish session */
  .holdbtn{position:relative; overflow:hidden; width:100%; min-height:52px; background:var(--card2); color:var(--danger); border:1px solid var(--danger); border-radius:12px; font-weight:700; touch-action:none;}
  .holdbtn:active{transform:none;}
  .holdbtn .fill{position:absolute; inset:0; background:rgba(255,122,110,.28); transform:scaleX(0); transform-origin:left center; transition:transform 150ms var(--ease-out);}
  .holdbtn.arming .fill{transform:scaleX(1); transition:transform 1.2s linear;}
  .holdbtn .txt{position:relative;}
  /* motion */
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0; transform:scale(.96)}}
  @keyframes sheetup{from{transform:translateY(100%)}}
  @keyframes fadeout{to{opacity:0}}
  @keyframes sheetdown{to{transform:translateY(100%)}}
  @keyframes popout{to{opacity:0; transform:scale(.96)}}
  @keyframes winring{from{opacity:.9; transform:scale(1)} to{opacity:0; transform:scale(1.06)}}
  .team.winflash{border-color:var(--win);}
  .team.winflash .chip{border-color:var(--win);}
  .team.winflash::after{content:''; position:absolute; inset:-2px; border:2px solid var(--win); border-radius:16px; pointer-events:none; animation:winring 280ms var(--ease-out) forwards;}
  /* reduced motion: keep fades and color, drop movement and scaling */
  @media (prefers-reduced-motion: reduce){
    button:active, .chip.vacant:active, .ptag:active, .chip.pressing, .qitem.pressing, .chip.lifting, .qitem.lifting{transform:none;}
    .modal{animation:fade 180ms ease;}
    .overlay.closing .modal{animation:fadeout 150ms ease forwards;}
    .toast{transform:none;}
    .team.winflash::after{animation:none; opacity:0;}
    .toggle .sw::after{transition:background-color 160ms ease;}
  }
</style>
</head>
<body>
<header class="top">
  <h1><img src="icon-192.png" alt="" width="26" height="26" style="vertical-align:-5px; border-radius:7px; margin-right:6px">Paddle<span>Cue</span></h1>
  <div class="status" id="status"></div>
</header>
<div class="wrap" id="app"></div>
<nav class="tabs hidden" id="tabs">
  <button data-action="tab" data-tab="play" class="on"><span class="ic">🏓</span>Courts</button>
  <button data-action="tab" data-tab="players"><span class="ic">👥</span>Players</button>
  <button data-action="tab" data-tab="log"><span class="ic">📋</span>Session</button>
</nav>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
/* ============================================================
   ENGINE — pure game/queue logic (no DOM)
   ============================================================ */
const LS_KEY = 'pickle-queue-v1';

let state = null;

const LEVELS = ['No level', 'Novice', 'Intermediate', 'Advanced'];
const LV_SHORT = ['', 'N', 'I', 'A'];

function freshState(entries, courtCount){
  const s = {
    screen:'main', startedAt:Date.now(), sid:Math.random().toString(36).slice(2,10), rev:0, tick:0, matchSeq:0,
    players:[], courts:[], matches:[], undoStack:[], settings:{ levelMatch:true }
  };
  entries.forEach(e => s.players.push(mkPlayer(s, e.n, 0, e.lv)));
  for(let i=1;i<=courtCount;i++) s.courts.push(mkCourt(i));
  return s;
}
function mkPlayer(s, name, base, level){
  return { id:'p'+(++s.tick)+'_'+Math.random().toString(36).slice(2,6),
    name, games:0, base:(base||0), wins:0, losses:0, wonLast:false, partnerId:null, level:(level||1), // everyone starts as Novice
    status:'queued', queuedAt:(++s.tick), history:[] };
}
function mkCourt(i){ return { id:i, phase:'idle', teams:null, startedAt:null }; }

function byId(id){ return state.players.find(p=>p.id===id); }
function nameOf(id){ const p=byId(id); return p?p.name:'?'; }
function effGames(p){ return p.games + p.base; }
function courtPlayers(c){ return c.teams ? [...c.teams[0], ...c.teams[1]].filter(Boolean) : []; }

/* Queue order: fewest (effective) games, then longest wait. Every player has a
   sort key {g, t}. Dragging a player in the queue gives ONLY that player a
   manual key ("pin") that sits between their new neighbours, so they keep moving
   up naturally as others play, and nobody else gets frozen. Pins clear when the
   player goes on court. */
function qKey(p){ return (p.pin && typeof p.pin==='object') ? p.pin : { g:effGames(p), t:p.queuedAt }; }
function keyCmp(a,b){ return (a.g-b.g) || (a.t-b.t); }
function prioritySort(list){ return list.slice().sort((a,b)=>keyCmp(qKey(a), qKey(b))); }
function reorderQueue(movePid, targetPid){
  const q = prioritySort(queuedPlayers());
  const from = q.findIndex(p=>p.id===movePid), to = q.findIndex(p=>p.id===targetPid);
  if(from<0 || to<0 || from===to) return false;
  const rest = q.filter(p=>p.id!==movePid);
  const ti = rest.findIndex(p=>p.id===targetPid);
  const ins = to<from ? ti : ti+1;            // moving up: before target; down: after it
  const before = rest[ins-1] ? qKey(rest[ins-1]) : null, after = rest[ins] ? qKey(rest[ins]) : null;
  let key;
  if(before && after && before.g===after.g) key = { g:after.g, t:(before.t+after.t)/2 };
  else if(after) key = { g:after.g, t:after.t-1 };
  else key = { g:before.g, t:before.t+1 };
  byId(movePid).pin = key;
  return true;
}
function queuedPlayers(){ return state.players.filter(p=>p.status==='queued'); }

function randomTeams(ids){
  const a=ids.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return [[a[0],a[1]],[a[2],a[3]]];
}

function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function setPartner(aId, bId){
  const A = byId(aId); if(!A) return;
  if(A.partnerId){ const old = byId(A.partnerId); if(old) old.partnerId = null; A.partnerId = null; }
  if(bId){
    const B = byId(bId); if(!B) return;
    if(B.partnerId){ const old = byId(B.partnerId); if(old) old.partnerId = null; }
    A.partnerId = B.id; B.partnerId = A.id;
  }
}

/* ---------- matchmaking ----------
   Every time a court frees up we score the possible lineups and take the
   cheapest. Fairness dominates: a novice who has played fewer games is never
   skipped, and nobody is skipped by two or more games. Within that, novices and
   the "upper" tier (intermediate + advanced) are kept on separate courts when
   both tiers can fill one; upper players may wait at most ONE game to stay
   grouped, so slow novice games never cost novices a turn. Then teams are split
   so they're evenly matched (level + wins) and partners/opponents rotate. */
const W = {
  invert:1000, // skipping a player who has played FEWER games (or was manually placed) — effectively never
  halfPair:200, // sending one fixed partner on without the other — only to stop someone who's played less sitting again
  anchor:  15, // skipping whoever is #1 in the queue (only happens when fixed pairs or tier grouping force it)
  rest:    25, // putting someone straight back on from the last match while a waiting player sits
  skip:     4, // skipping a same-game-count player who has waited longer (to get a better match)
  upperWait:15, // letting an int/adv player wait one game so a novice four (or upper four) can form
  tierMix: 40, // a court mixing novices with int/adv players, at full tier-grouping strength
  novFirst: 8, // on equal game counts, novices go first: their games run longer, so they'd otherwise fall behind
  spread:   5, // per level of difference between strongest and weakest in the four
  partner:  4, // per time two teammates have already partnered
  opp:      1, // per time two players have already faced each other
  balance:  3, // per strength-point difference between the two teams (win rate + level)
};
const WIN_SPAN = 0.75; // win rate nudges strength by at most ±0.75 — less than one level step

/* Team-balancing strength. Level is the main signal (always used, even with
   level grouping off) because wins can mislead: an advanced player taking it
   easy with novices still counts as advanced. Win rate (smoothed, so one lucky
   game barely counts) fine-tunes it within a level. Keeps two strong players
   from being teamed up against two weaker ones. */
function strength(p){
  const wr = ((p.wins||0)+1) / ((p.games||0)+2);
  return lv(p) + WIN_SPAN * (wr-0.5) * 2;
}
const LOOKAHEAD = 4; // how far past the top 4 we look for a better level match
const TIER_LOOKAHEAD = 8; // further, when there are enough players to keep tiers apart

function lv(p){ return (p && p.level) || 0; }
function levelMatchOn(){ return !state.settings || state.settings.levelMatch!==false; }
function isUpper(p){ return lv(p)>=2; }
/* How hard to keep novices and int/adv apart: 0 when either tier can't fill a
   court on its own (mixing is unavoidable), rising to 1 as the two tiers even out. */
function tierStrength(){
  if(!levelMatchOn()) return 0;
  const act = state.players.filter(p=>p.status==='queued' || p.status==='playing');
  const up = act.filter(isUpper).length, nov = act.length - up;
  if(up<4 || nov<4) return 0;
  return 0.5 + 0.5 * Math.min(up, nov) / Math.max(up, nov);
}

function pairCounts(){
  const part = new Map(), opp = new Map();
  const k = (a,b)=> a<b ? a+'|'+b : b+'|'+a;
  const inc = (m,a,b)=> m.set(k(a,b), (m.get(k(a,b))||0)+1);
  for(const m of state.matches){
    if(!m.ai || !m.bi) continue; // older records only stored names
    for(const T of [m.ai, m.bi]) if(T.length===2) inc(part, T[0], T[1]);
    for(const x of m.ai) for(const y of m.bi) inc(opp, x, y);
  }
  return { part:(a,b)=>part.get(k(a,b))||0, opp:(a,b)=>opp.get(k(a,b))||0 };
}

const SPLITS = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
function splitCost(ps, sp, pc){
  const A = sp[0].map(i=>ps[i]), B = sp[1].map(i=>ps[i]);
  for(const p of ps){ // fixed partners must share a team
    if(!p.partnerId || !ps.some(x=>x.id===p.partnerId)) continue;
    const together = [A,B].some(T=>T.includes(p) && T.some(x=>x.id===p.partnerId));
    if(!together) return Infinity;
  }
  let c = W.partner * (pc.part(A[0].id, A[1].id) + pc.part(B[0].id, B[1].id));
  for(const x of A) for(const y of B) c += W.opp * pc.opp(x.id, y.id);
  const sum = T => T.reduce((n,p)=>n+strength(p), 0);
  c += W.balance * Math.abs(sum(A)-sum(B));
  return c;
}
function bestSplit(ps, pc){
  let best = null, bc = Infinity;
  for(const sp of shuffleArr(SPLITS)){ const c = splitCost(ps, sp, pc); if(c<bc){ bc=c; best=sp; } }
  if(!best) return null;
  return { cost:bc, teams:[best[0].map(i=>ps[i].id), best[1].map(i=>ps[i].id)] };
}

/* Returns { players:[4], teams:[[a,b],[c,d]] } or null. Pure: doesn't change state. */
function chooseFour(pc){
  const q = prioritySort(queuedPlayers());
  if(q.length<4) return null;
  pc = pc || pairCounts();
  const rank = new Map(q.map((p,i)=>[p.id,i]));
  const mateOf = p => p.partnerId && rank.has(p.partnerId) ? byId(p.partnerId) : null;
  const tiers = tierStrength();
  // Before the first game, queue order is just the order names were typed: it
  // means nothing, so look at everyone and don't charge for "skipping" anyone.
  const fresh = state.matches.length===0;
  let pool;
  if(fresh){ // up to 6 of each tier in typed order: enough to form whole-tier fours, small enough to stay fast on a phone
    const nov = q.filter(p=>!isUpper(p)).slice(0,6), up = q.filter(isUpper).slice(0,6);
    pool = q.filter(p=>nov.includes(p) || up.includes(p));
  } else pool = q.slice(0, 4 + (tiers>0 ? TIER_LOOKAHEAD : LOOKAHEAD));
  for(const p of pool.slice()){ const m = mateOf(p); if(m && !pool.includes(m)) pool.push(m); } // pairs travel together
  const anchor = q[0], n = pool.length;
  const last = state.matches[0], justPlayed = new Set(last && last.ai ? [...last.ai, ...last.bi] : []);
  let best = null;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) for(let c3=b+1;c3<n;c3++) for(let d=c3+1;d<n;d++){
    const ps = [pool[a], pool[b], pool[c3], pool[d]];
    // a chosen player who came in as someone's partner borrows that partner's place
    const eff = p => { const m = mateOf(p); return m && ps.includes(m) ? Math.min(rank.get(p.id), rank.get(m.id)) : rank.get(p.id); };
    let cost = W.halfPair * ps.filter(p=>{ const m = mateOf(p); return m && !ps.includes(m); }).length;
    for(const s of pool){
      if(ps.includes(s)) continue;
      if(s===anchor && !fresh) cost += W.anchor;
      let waited = false;
      for(const c of ps){
        if(eff(c) <= rank.get(s.id)) continue;
        const gap = qKey(c).g - qKey(s).g;
        if(gap>0 || s.pin){
          // the one allowed exception: an int/adv player may sit ONE game so novices
          // can play together. Never a novice, never two games, never a placed player.
          if(tiers>0 && !s.pin && gap===1 && isUpper(s) && !isUpper(c)){
            if(!waited){ cost += W.upperWait; waited = true; }
            if(justPlayed.has(c.id) && !justPlayed.has(s.id)) cost += W.rest;
            continue;
          }
          cost += W.invert; continue;
        }
        if(!fresh) cost += W.skip;
        if(tiers>0 && !fresh && !isUpper(s) && isUpper(c)) cost += W.novFirst;
        if(justPlayed.has(c.id) && !justPlayed.has(s.id)) cost += W.rest;
      }
    }
    if(levelMatchOn()){
      const known = ps.map(lv).filter(Boolean);
      if(known.length>1) cost += W.spread * (Math.max(...known)-Math.min(...known));
      const up = ps.filter(isUpper).length;
      if(tiers>0 && up>0 && up<4) cost += W.tierMix * tiers; // novices mixed in with int/adv
      // first round: novices take the first court(s), a head start for their longer games
      if(tiers>0 && fresh && up===0) cost -= W.novFirst;
    }
    const split = bestSplit(ps, pc);
    if(!split) continue;
    cost += split.cost;
    if(!best || cost < best.cost) best = { cost, players:ps, teams:split.teams };
  }
  if(best) return best;
  const ps = q.slice(0,4); // last resort: break a pair rather than stall the court
  return { players:ps, teams:randomTeams(ps.map(p=>p.id)) };
}

/* Split 4 into teams, keeping fixed pairs on the same side */
function teamsFor(ids){
  const ps = ids.map(byId), used = new Set(), pairs = [], singles = [];
  for(const p of ps){
    if(!p || used.has(p.id)) continue;
    const mate = ps.find(x=>x && x.id===p.partnerId);
    if(mate && !used.has(mate.id)){ pairs.push([p.id, mate.id]); used.add(p.id); used.add(mate.id); }
  }
  for(const p of ps) if(p && !used.has(p.id)) singles.push(p.id);
  if(pairs.length===2) return shuffleArr(pairs);
  if(pairs.length===1){ const s = shuffleArr(singles); return shuffleArr([pairs[0], [s[0], s[1]]]); }
  return randomTeams(ids);
}

/* Fill any idle court with the best-scoring four from the queue */
function fillCourts(){
  const pc = pairCounts();
  for(const c of state.courts){
    if(c.phase!=='idle') continue;
    const pick = chooseFour(pc);
    if(!pick) continue;
    pick.players.forEach(p=>{ p.status='playing'; p.pin=null; });
    c.teams = pick.teams;
    c.phase = 'staging';
    c.startedAt = null;
  }
}

function takeFromQueue(n){
  const q = prioritySort(queuedPlayers());
  const out = []; const inOut = id => out.some(p=>p.id===id);
  for(const p of q){
    if(out.length>=n) break;
    if(inOut(p.id)) continue;
    const mate = p.partnerId ? q.find(x=>x.id===p.partnerId && !inOut(x.id)) : null;
    if(mate){ if(n-out.length>=2) out.push(p, mate); }
    else out.push(p);
  }
  for(const p of q){ if(out.length>=n) break; if(!inOut(p.id)) out.push(p); }
  return out.slice(0, n);
}
function shuffleTeams(courtId){
  const c = state.courts.find(x=>x.id===courtId);
  if(!c || !c.teams) return;
  const ids = courtPlayers(c);
  if(ids.length<4){
    takeFromQueue(4-ids.length).forEach(p=>{ p.status='playing'; p.pin=null; ids.push(p.id); });
  }
  if(ids.length===4){ const sp = bestSplit(ids.map(byId), pairCounts()); c.teams = sp ? sp.teams : teamsFor(ids); }
  else {
    const s = shuffleArr(ids);
    c.teams = [[s[0]||'', s[1]||''], [s[2]||'', s[3]||'']];
  }
}

/* One tap = next of the 3 possible teammate pairings for this court
   (skips pairings that would separate 🔗 fixed partners). */
function swapTeammates(courtId){
  const c = state.courts.find(x=>x.id===courtId);
  if(!c || !c.teams || courtPlayers(c).length<4) return false;
  const ids = courtPlayers(c).slice().sort(), a = ids[0], others = ids.slice(1);
  const mateNow = c.teams.find(T=>T.includes(a)).find(x=>x!==a);
  const start = others.indexOf(mateNow);
  for(let step=1; step<=2; step++){
    const mate = others[(start+step)%3], rest = others.filter(x=>x!==mate);
    const ps = [a, mate, ...rest].map(byId);
    if(splitCost(ps, [[0,1],[2,3]], { part:()=>0, opp:()=>0 })===Infinity) continue; // would split fixed partners
    const aOnA = c.teams[0].includes(a); // keep everyone on the same side of the screen where possible
    c.teams = aOnA ? [[a, mate], rest] : [rest, [a, mate]];
    return true;
  }
  return false;
}

function startMatch(courtId){
  const c = state.courts.find(x=>x.id===courtId);
  if(!c || c.phase!=='staging' || courtPlayers(c).length<4) return false;
  c.phase='playing'; c.startedAt=Date.now(); return true;
}

/* Find where a player currently sits on any court: {court, ti, pi} or null */
function findSlot(pid){
  for(const c of state.courts){
    if(!c.teams) continue;
    for(let ti=0;ti<2;ti++){
      const pi = c.teams[ti].indexOf(pid);
      if(pi>-1) return {court:c, ti, pi};
    }
  }
  return null;
}

/* Swap any two players: court↔court (incl. same court = team swap) or court↔queue (substitution) */
function swapPlayers(aId, bId){
  if(aId===bId) return false;
  const A=byId(aId), B=byId(bId);
  if(!A||!B) return false;
  const sa=findSlot(aId), sb=findSlot(bId);
  if(sa && sb){
    sa.court.teams[sa.ti][sa.pi]=bId;
    sb.court.teams[sb.ti][sb.pi]=aId;
    return true;
  }
  if(sa && !sb){ return subIn(sa, A, B); }
  if(sb && !sa){ return subIn(sb, B, A); }
  return false; // both in queue — nothing to swap
}
function subIn(slot, onCourt, fromQueue){
  if(fromQueue.status!=='queued') return false;
  slot.court.teams[slot.ti][slot.pi] = fromQueue.id;
  fromQueue.status='playing'; fromQueue.pin=null;
  onCourt.status='queued'; onCourt.queuedAt=(++state.tick); onCourt.pin=null;
  return true;
}

/* Bench a court player without a replacement — their slot stays open */
function removeFromCourt(pid){
  const slot = findSlot(pid); if(!slot) return false;
  const p = byId(pid); if(!p) return false;
  slot.court.teams[slot.ti][slot.pi] = '';
  p.status='queued'; p.queuedAt=(++state.tick); p.pin=null;
  const c = slot.court;
  /* Court is held open (even fully empty) until Shuffle fills it or players
     are dropped in. A playing court emptied mid-match falls back to staging. */
  if(courtPlayers(c).length===0 && c.phase==='playing'){ c.phase='staging'; c.startedAt=null; }
  return true;
}
/* Put a player (from queue or another slot) into a specific open slot */
function placeVacant(pid, courtId, ti, pi){
  const c = state.courts.find(x=>x.id===courtId);
  if(!c || !c.teams || c.teams[ti][pi]) return false;
  const p = byId(pid); if(!p) return false;
  const slot = findSlot(pid);
  if(slot){ slot.court.teams[slot.ti][slot.pi] = ''; }
  else if(p.status!=='queued') return false;
  c.teams[ti][pi] = pid;
  p.status='playing'; p.pin=null;
  return true;
}

function pushUndo(){
  state.undoStack.push(JSON.stringify({...state, undoStack:[]}));
  if(state.undoStack.length>10) state.undoStack.shift();
}
function undo(){
  const snap = state.undoStack.pop();
  if(!snap) return false;
  const keep = state.undoStack, rev = state.rev||0;
  state = normalizeState(JSON.parse(snap));
  state.undoStack = keep;
  state.rev = Math.max(state.rev||0, rev); // never go backwards, or live viewers ignore us
  return true;
}

function finishMatch(courtId, winnerIdx, sa, sb){
  const c = state.courts.find(x=>x.id===courtId);
  if(!c || !c.teams) return;
  pushUndo();
  const rec = { id:(++state.matchSeq), court:c.id,
    a:c.teams[0].filter(Boolean).map(nameOf), b:c.teams[1].filter(Boolean).map(nameOf),
    ai:c.teams[0].filter(Boolean), bi:c.teams[1].filter(Boolean),
    sa:(sa??null), sb:(sb??null), w:winnerIdx, t:Date.now() };
  state.matches.unshift(rec);
  for(let ti=0; ti<2; ti++){
    const won = (ti===winnerIdx);
    for(const pid of c.teams[ti]){
      const p = byId(pid); if(!p) continue;
      p.games++; won ? p.wins++ : p.losses++;
      p.wonLast = won;
      const mateId = c.teams[ti].find(x=>x && x!==pid);
      (p.history = p.history||[]).unshift({ m:rec.id, teammate: mateId ? nameOf(mateId) : '—', won,
        score:(sa!=null&&sb!=null) ? (ti===0? sa+'–'+sb : sb+'–'+sa) : null });
      p.status='queued'; p.queuedAt=(++state.tick); p.pin=null;
    }
  }
  c.phase='idle'; c.teams=null; c.startedAt=null;
  fillCourts();
}

function addPlayer(name, level){
  /* Late joiners go on the NEXT court that frees up (it's polite). They start
     level with whoever has played the least, and are put at the front of that
     group; several late arrivals keep their arrival order. After their first
     game they rotate normally. Their real played count still shows in stats. */
  const active = state.players.filter(p=>p.status==='queued' || p.status==='playing');
  const base = active.length ? Math.min(...active.map(effGames)) : 0;
  const p = mkPlayer(state, name, base, level);
  if(state.matches.length){
    p.late = true;
    state.lateSeq = (state.lateSeq||0)+1;
    p.queuedAt = -1e6 + state.lateSeq; // ahead of everyone else at this game count
  }
  state.players.push(p);
  fillCourts();
  return p;
}

function toggleBreak(pid){
  const p = byId(pid); if(!p) return false;
  if(p.status==='playing') return false; // must sub out first
  if(p.status==='queued'){ p.status='break'; p.pin=null; }
  else if(p.status==='break'){ p.status='queued'; p.queuedAt=(++state.tick); fillCourts(); }
  return true;
}

function removePlayer(pid){
  const p = byId(pid); if(!p) return false;
  if(p.status==='playing') return false;
  if(p.partnerId) setPartner(p.id, null);
  if(p.games>0){ p.status='out'; }
  else { state.players = state.players.filter(x=>x.id!==pid); }
  return true;
}

function setCourtCount(n){
  n = Math.max(1, Math.min(12, n|0));
  const cur = state.courts.length;
  if(n>cur){
    // reuse the lowest free court numbers so two courts never share an id
    const used = new Set(state.courts.map(c=>c.id));
    for(let id=1; state.courts.length<n; id++) if(!used.has(id)) state.courts.push(mkCourt(id));
    state.courts.sort((a,b)=>a.id-b.id);
    fillCourts();
  }
  else if(n<cur){
    // remove idle courts from the end only
    for(let i=cur-1; i>=0 && state.courts.length>n; i--){
      if(state.courts[i].phase==='idle') state.courts.splice(i,1);
    }
  }
}

var IS_VIEWER = false;
function save(){
  if(IS_VIEWER) return; // viewers are read-only
  state.rev = (state.rev||0)+1; // bump before storing so a reload never reuses a version number
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(typeof pushLive==='function') pushLive();
}
function sessionAsText(){
  const L=[];
  L.push('PADDLECUE — OPEN PLAY SESSION LOG');
  L.push('Exported: '+new Date().toLocaleString());
  L.push('');
  L.push('STANDINGS');
  state.players.filter(p=>p.status!=='out' || p.games>0)
    .slice().sort((a,b)=>b.wins-a.wins || a.losses-b.losses)
    .forEach(p=>L.push(`  ${p.name}: ${p.games} games, ${p.wins}W–${p.losses}L${p.late?' (joined late)':''}${p.status==='out'?' (left early)':''}`));
  L.push('');
  L.push('MATCHES');
  state.matches.slice().reverse().forEach(m=>{
    const t=new Date(m.t), hh=t.getHours()%12||12, mm=String(t.getMinutes()).padStart(2,'0'), ap=t.getHours()<12?'am':'pm';
    const win=(m.w===0?m.a:m.b).join(' & '), lose=(m.w===0?m.b:m.a).join(' & ');
    const sc=(m.sa!=null&&m.sb!=null)?` ${m.w===0?m.sa+'–'+m.sb:m.sb+'–'+m.sa}`:'';
    L.push(`  #${m.id} Court ${m.court} ${hh}:${mm}${ap} — ${win} def. ${lose}${sc}`);
  });
  return L.join('\n');
}
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ state = JSON.parse(raw); if(state.screen!=='setup') normalizeState(state); } }catch(e){ state=null; }
}
/* ============================================================
   UI
   ============================================================ */
const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');
const $modalHost = document.getElementById('modalHost');
const ui = { tab:'play', selected:null, setupNames:[] };
const finishing = new Set();

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* tiny haptic tick on Android; skipped until the person has really tapped (browsers block it otherwise) */
function buzz(){ try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8); }catch(e){} }
function renderStatus(){
  const el = document.getElementById('status'); if(!el) return;
  if(IS_VIEWER || !state || state.screen!=='main'){ el.innerHTML=''; return; }
  const n = state.players.filter(p=>p.status!=='out').length, c = state.courts.length;

/* Hold-to-drag needs to stop the page scrolling once a card is lifted. That
   listener can't be passive, so it lives only on the name cards: scrolling
   that starts anywhere else stays fully passive and smooth. */
function bindChipTouch(){
  document.querySelectorAll('[data-chip]').forEach(el=>el.addEventListener('touchmove', stopScrollWhileLifted, {passive:false}));
}

/* FLIP: name cards glide from where they were to where they are now.
   Composite-only (transform/opacity) via WAAPI so it stays smooth on phones. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE_OUT = 'cubic-bezier(.23,1,.32,1)', EASE_IN_OUT = 'cubic-bezier(.77,0,.175,1)';
function animatedRender(){
  const old = new Map();
  document.querySelectorAll('[data-chip]').forEach(el=>old.set(el.dataset.chip, el.getBoundingClientRect()));
  render();
  if(!old.size) return;
  requestAnimationFrame(()=>{
    let entering = 0;
    document.querySelectorAll('[data-chip]').forEach(el=>{
      const prev = old.get(el.dataset.chip);
      if(REDUCED){ // gentler, not nothing: new names fade in, nobody slides
        if(!prev) el.animate([{opacity:0},{opacity:1}],{duration:150, easing:'ease'});
        return;
      }
      if(prev){
        const now = el.getBoundingClientRect(), dx = prev.left-now.left, dy = prev.top-now.top;
        if(Math.abs(dx)>2 || Math.abs(dy)>2)
          el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:260, easing:EASE_IN_OUT});
      } else {
        // a freshly filled court: the four names arrive 40ms apart instead of all at once
        el.animate([{opacity:0, transform:'scale(.96)'},{opacity:1, transform:'none'}],
          {duration:200, delay:Math.min(entering++, 4)*40, easing:EASE_OUT, fill:'backwards'});
      }
    });
  });
}

/* Who goes on the next court that frees up (same logic fillCourts uses).
   With fewer than 4 waiting, everyone waiting is up next. */
let nextUpMemo = { key:null, ids:null };
function nextUpIds(){
  // re-run the matchmaker only when the queue, levels, games or settings actually changed,
  // not on every tap that just selects a name
  const key = [state.rev, state.matches.length, levelMatchOn(), ...state.players.map(p=>p.id+p.status+p.games+p.level+(p.pin?p.pin.t:'')+(p.partnerId||''))].join('|');
  if(nextUpMemo.key===key) return nextUpMemo.ids;
  const pick = chooseFour();
  const ids = new Set(pick ? pick.players.map(p=>p.id) : queuedPlayers().map(p=>p.id));
  nextUpMemo = { key, ids };
  return ids;
}

  const q = prioritySort(queuedPlayers());
  if(!q.length) return '<p class="subtle" style="padding:12px 4px 4px">Everyone is on court.</p>';
  const nextUp = nextUpIds();
  const up = q.filter(p=>nextUp.has(p.id)), rest = q.filter(p=>!nextUp.has(p.id));
  const short = up.length<4 ? `<span class="subtle"> · ${up.length} of 4, the rest come off the next game</span>` : '';
  return `<div class="upnext"><div class="label">Up next${short}</div>${up.map((p,i)=>rowHtml(p,i,true)).join('')}</div>`
    + (rest.length ? `<div class="waitlabel">Waiting</div>${rest.map((p,i)=>rowHtml(p,up.length+i,false)).join('')}` : '');
}

/* invisible anonymous sign-in: one id per phone, refreshed in the background */
const AUTH_KEY = 'pc-auth-v1';
let authInfo = null; try{ authInfo = JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){}
let authPending = null;
function authSave(){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(authInfo)); }catch(e){} }
async function getToken(){
  if(authInfo && authInfo.idToken && authInfo.exp > Date.now()+60000) return authInfo.idToken;
  if(authPending) return authPending;
  authPending = (async ()=>{
    if(authInfo && authInfo.refreshToken){
      const r = await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey, { method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(authInfo.refreshToken) });
      if(r.ok){ const j = await r.json(); authInfo = { uid:j.user_id, idToken:j.id_token, refreshToken:j.refresh_token, exp:Date.now()+(+j.expires_in)*1000 }; authSave(); return authInfo.idToken; }
    }
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey, { method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({ returnSecureToken:true }) });
    if(!r.ok) throw new Error('sign-in failed ('+r.status+')');
    const j = await r.json();
    authInfo = { uid:j.localId, idToken:j.idToken, refreshToken:j.refreshToken, exp:Date.now()+(+j.expiresIn)*1000 }; authSave();
    return authInfo.idToken;
  })();
  try{ return await authPending; } finally { authPending = null; }
}

function newRoomId(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = crypto.getRandomValues(new Uint8Array(16));
  return [...b].map(x=>abc[x % abc.length]).join('');
}
function roomUrl(id, token, query){ return `${FB.db}/rooms/${id}.json${token||query ? '?' : ''}${token ? 'auth='+token : ''}${token&&query ? '&' : ''}${query||''}`; }
function liveLink(){ return location.origin + location.pathname + '#r=' + live.room; }

let pushT = null;
/* Only the host writes. state.rev is bumped in save(), so every push is strictly newer. */
function pushLive(){
  if(IS_VIEWER || !live.on || !live.room || !state || state.screen==='setup' || !liveReady()) return;
  clearTimeout(pushT);
  pushT = setTimeout(async ()=>{
    try{
      const token = await getToken();
      const body = { owner:authInfo.uid, t:{'.sv':'timestamp'}, state:{ ...state, undoStack:[] } };
      const r = await fetch(roomUrl(live.room, token), { method:'PUT', body:JSON.stringify(body) });
      if(!r.ok) throw new Error('save failed ('+r.status+')');
      if(live.failing){ live.failing = false; renderStatus(); }
    }catch(err){
      if(!live.failing){ live.failing = true; renderStatus(); toast("Live view couldn't update. It will retry on your next change."); }
    }
  }, 400);
}
async function goLive(){
  if(!liveReady()){ toast("Live sharing isn't set up yet"); return false; }
  try{ await getToken(); }catch(e){ toast("Couldn't connect. Check your signal and try again."); return false; }
  await retireIfExpired();
  if(!live.room) live.room = newRoomId();
  live.on = true; liveSave(); pushLive();
  return true;
}
async function stopLive(){
  const id = live.room; live.on = false; live.room = null; live.failing = false; liveSave();
  if(id && liveReady()){ try{ const token = await getToken(); await fetch(roomUrl(id, token), { method:'DELETE' }); }catch(e){} }
}
/* A room with no updates for 7 days is retired: it's deleted and the next go-live starts a
   fresh room (new QR). Rooms abandoned on other phones are swept by a daily server-side
   cleanup (planned with the notification helper). */
async function retireIfExpired(){
  if(!live.room || !liveReady()) return;
  try{
    const r = await fetch(roomUrl(live.room));
    const room = r.ok ? await r.json() : null;
    if(room && typeof room.t==='number' && room.t < Date.now() - WEEK){
      const token = await getToken();
      await fetch(roomUrl(live.room, token), { method:'DELETE' });
      live.room = null; liveSave();
    }
  }catch(e){}
}
/* opening the app after a week away: retire the old room, and if still live, carry on in a new one */
async function resumeLive(){
  if(!live.on || !liveReady()) return;
  const before = live.room;
  await retireIfExpired();
  if(!live.room){ live.room = newRoomId(); liveSave(); if(before) toast('Your live link was a week old, so it was renewed. Show the new QR.'); }
  pushLive(); renderStatus();
}

function normalizeState(s){
  s.players = s.players||[]; s.courts = s.courts||[]; s.matches = s.matches||[]; s.undoStack = s.undoStack||[];
  s.settings = s.settings||{ levelMatch:true };
  s.players.forEach(p=>{
    p.history = p.history||[];
    p.level = p.level||1; // untagged → Novice
    if(p.pin!=null && typeof p.pin!=='object') p.pin = null; // old numeric pins
  });
  s.courts.forEach(c=>{ if(c.teams && (!c.teams[0] || !c.teams[1])) c.teams = null; });
  return s;
}

/* viewer: opened from the host's QR (#r=<room>) — read-only, nothing to tap */
let viewerLastT = 0;
function viewerMessage(text){ $app.innerHTML = `<div class="card" style="text-align:center"><p style="margin:8px 0">${text}</p></div>`; }
function startViewer(id){
  IS_VIEWER = true; state = null;
  $tabs.classList.add('hidden');
  viewerMessage('<span class="subtle">Connecting to the live session…</span>');
  const url = roomUrl(id);
  const apply = room => {
    if(!room || !room.state){ state = null; viewerMessage('This live session has ended.<br><span class="subtle">Ask the host to show their QR code again.</span>'); return; }
    const data = room.state;
    // ignore stale updates; a host that started over may restart its version count
    if(state && data.sid===state.sid && (data.rev||0) <= (state.rev||0)) return;
    state = normalizeState(data); viewerLastT = room.t || Date.now(); render();
  };
  const poll = ()=>{ fetch(url).then(r=>r.ok ? r.json() : null).then(apply).catch(()=>{}); };
  let pollT = null;
  try{
    const es = new EventSource(url);
    es.addEventListener('put', e=>{ try{ const d = JSON.parse(e.data); (d.path==='/' ? apply(d.data) : poll()); }catch(err){} });
    es.addEventListener('patch', ()=>poll());
    es.onerror = ()=>{ if(!pollT) pollT = setInterval(poll, 5000); };
  }catch(e){ pollT = setInterval(poll, 5000); }
  poll();
}
function vchip(pid){
  if(!pid) return '<div class="chip vacant"><small>open slot</small></div>';
  const p = byId(pid);
  return `<div class="chip">${esc(p?p.name:'?')}<small>${chipSub(p)}</small></div>`;
}
function renderViewer(){
  if(!state || !state.players) return;
  const courtsHtml = state.courts.map(c=>{
    const body = !c.teams ? '<div class="empty-court">Court open</div>' : `
      <div class="teams">
        <div class="team a"><div class="tname">Team A</div>${c.teams[0].map(vchip).join('')}</div>
        <div class="vs">VS</div>
        <div class="team b"><div class="tname">Team B</div>${c.teams[1].map(vchip).join('')}</div>
      </div>`;
    const badge = c.phase==='playing' ? `<span class="badge play">● playing <span class="timer" data-start="${c.startedAt}">0:00</span></span>`
                : c.phase==='staging' ? '<span class="badge stage">setting teams</span>' : '<span class="badge">open</span>';
    return `<div class="court"><div class="head"><b>Court ${c.id}</b>${badge}</div><div class="body">${body}</div></div>`;
  }).join('');
  const queueHtml = queueSectionsHtml((p,i,isNext)=>`
    <div class="qitem ${isNext?'next':''}"><span class="qpos">${i+1}</span>
      <div class="qmain"><div class="qline"><b>${esc(p.name)}</b>${lvBadge(p.level)}</div><div class="meta">${queueMeta(p)}</div></div>
    </div>`);
  const rank = rankedPlayers(), medals=['🥇','🥈','🥉'];
  const standings = rank.map((p,i)=>`<tr><td style="width:36px">${medals[i]||(i+1)+'.'}</td><td><b>${esc(p.name)}</b>${p.late?' <span class="tag zz">⏰</span>':''}</td><td>${p.wins}–${p.losses}</td><td class="subtle">${p.games} games</td></tr>`).join('');
  const u = new Date(viewerLastT);
  $app.innerHTML = `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px">
      <b style="color:var(--accent)">● LIVE</b>
      <span class="subtle">updated ${u.getHours()%12||12}:${String(u.getMinutes()).padStart(2,'0')}</span>
    </div>
    ${state.screen==='summary' ? '<div class="card" style="text-align:center"><h3>🏁 Session wrapped</h3></div>' : ''}
    ${courtsHtml}
    <div class="card"><h3 style="margin-bottom:6px">🏓 Up next</h3>${queueHtml}</div>
    <div class="card"><h3 style="margin-bottom:8px">Standings</h3><table>${standings||''}</table></div>
    <div class="card"><h3 style="margin-bottom:8px">Matches</h3>${matchListHtml()||'<p class="subtle">No matches yet.</p>'}</div>`;
}

/* ---------- session summary ---------- */
function rankedPlayers(){
  return state.players.filter(p=>p.games>0)
    .slice().sort((a,b)=>b.wins-a.wins || a.losses-b.losses || b.games-a.games);
}
function shareText(){
  const d = new Date(state.startedAt||Date.now());
  const rank = rankedPlayers(), medals=['🥇','🥈','🥉'], L=[];
  L.push(`🏓 PaddleCue open play — ${d.toLocaleDateString(undefined,{month:'short', day:'numeric'})}`);
  L.push(`${rank.length} players · ${state.matches.length} matches`);
  L.push('');
  L.push('Standings:');
  rank.forEach((p,i)=>L.push(`${medals[i]||(i+1)+'.'} ${p.name}${p.late?' ⏰':''} — ${p.wins}W ${p.losses}L`));
  if(rank.some(p=>p.late)) L.push('⏰ joined late');
  L.push('');
  L.push('Matches:');
  state.matches.slice().reverse().forEach(m=>{
    const win=(m.w===0?m.a:m.b).join(' & '), lose=(m.w===0?m.b:m.a).join(' & ');
    const sc=(m.sa!=null&&m.sb!=null)? ` ${m.w===0? m.sa+'–'+m.sb : m.sb+'–'+m.sa}` : '';
    L.push(`• ${win} def. ${lose}${sc}`);
  });
  return L.join('\n');
}
function renderSummary(){
  $tabs.classList.add('hidden');
  const rank = rankedPlayers(), medals=['🥇','🥈','🥉'];
  const rows = rank.map((p,i)=>`<tr><td style="width:36px; font-size:16px">${medals[i]||(i+1)+'.'}</td><td><b>${esc(p.name)}</b>${p.late?' <span class="tag zz">⏰ late</span>':''}</td><td>${p.wins}–${p.losses}</td><td class="subtle">${p.games} games</td></tr>`).join('');
  const d = new Date(state.startedAt||Date.now());
  const dur = (state.endedAt && state.startedAt) ? Math.max(1, Math.round((state.endedAt-state.startedAt)/60000)) : null;
  const durTxt = dur ? (dur>=60 ? Math.floor(dur/60)+'h '+(dur%60)+'m' : dur+'m') : '';
  const live = state.courts.some(c=>c.teams);
  $app.innerHTML = `
    <div class="card" style="text-align:center">
      <h2>🏁 Session wrapped</h2>
      <p class="subtle" style="margin-top:6px">${d.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})} · ${rank.length} players · ${state.matches.length} matches${durTxt? ' · '+durTxt : ''}</p>
      ${live? '<p class="hint">⚠ A match was still in progress — it isn\'t counted. Resume the session to finish it.</p>':''}
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Final standings</h3><table>${rows||''}</table>${rank.some(p=>p.late)?'<p class="hint">⏰ = joined late, so their game count starts from when they arrived.</p>':''}</div>
    <div class="card">
      <h3 style="margin-bottom:10px">Send to the group</h3>
      <div class="row">
        <button class="btn primary grow" data-action="share-summary">📤 Share</button>
        <button class="btn grow" data-action="copy-summary">📋 Copy</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn grow" data-action="export-txt">📄 Log .txt</button>
        <button class="btn grow" data-action="export-json">💾 Backup .json</button>
      </div>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">All matches</h3>${matchListHtml()||'<p class="subtle">No matches recorded.</p>'}</div>
    <div class="row" style="margin-bottom:20px">
      <button class="btn ghost grow" data-action="resume-session">← Resume session</button>
      <button class="btn grow" data-action="new-session" style="color:var(--danger)">Start fresh</button>
    </div>`;
}

/* ---------- QR modal ---------- */
function openQrModal(){
  const url = liveLink();
  $modalHost.innerHTML = `
    <div class="overlay" data-action="modal-bg">
      <div class="modal" style="text-align:center">
        <h3>Scan to follow along</h3>
        <p class="subtle" style="margin:6px 0 12px">Point a phone camera here. Courts, queue and standings open right in their browser, nothing to type or install.</p>
        <div id="qrBox" style="background:#fff; border-radius:12px; padding:14px; display:inline-flex; align-items:center; justify-content:center; min-width:248px; min-height:248px"><span style="color:#888; font-size:13px">Generating…</span></div>
        <div class="row" style="margin-top:14px">
          <button class="btn grow" data-action="live-copy">📋 Copy link</button>
          <button class="btn ghost grow" data-action="modal-close">Close</button>
        </div>
      </div>
    </div>`;
  const box = document.getElementById('qrBox');
  const make = ()=>{ box.innerHTML=''; new QRCode(box, {text:url, width:220, height:220, correctLevel:QRCode.CorrectLevel.M}); };
  const fallback = ()=>{ box.innerHTML = '<img width="220" height="220" alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url)+'">'; };
  if(window.QRCode){ make(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = make; s.onerror = fallback;
  document.head.appendChild(s);
}

/* ---------- finish modal ---------- */
function openFinishModal(courtId){
  const c = state.courts.find(x=>x.id===courtId); if(!c||!c.teams) return;
  const an = c.teams[0].filter(Boolean).map(nameOf).join(' & '), bn = c.teams[1].filter(Boolean).map(nameOf).join(' & ');
  $modalHost.innerHTML = `
    <div class="overlay" data-action="modal-bg">
      <div class="modal" role="dialog" aria-label="Who won on court ${c.id}">
        <h3>Court ${c.id}: who won?</h3>
        <p class="subtle">Tap the winners. Scores are optional; if you enter both, the higher score wins.</p>
        <div class="fteams">
          <div class="fteam a" id="ftA">
            <div class="names">${esc(an)}</div>
            <input id="sa" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="score" min="0" aria-label="Team A score">
            <button class="btn" data-action="win" data-court="${c.id}" data-w="0">🏆 Won</button>
          </div>
          <div class="fteam b" id="ftB">
            <div class="names">${esc(bn)}</div>
            <input id="sb" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="score" min="0" aria-label="Team B score">
            <button class="btn" data-action="win" data-court="${c.id}" data-w="1">🏆 Won</button>
          </div>
        </div>
        <button class="btn ghost" style="width:100%" data-action="modal-close">Cancel</button>
      </div>
    </div>`;
  // as scores are typed, highlight the leading team so the winner tap matches the score
  const sa = document.getElementById('sa'), sb = document.getElementById('sb');
  const A = document.getElementById('ftA'), B = document.getElementById('ftB');
  const sync = ()=>{
    const x = sa.value, y = sb.value, both = x!=='' && y!=='' && +x!==+y;
    A.classList.toggle('lead', both && +x>+y); B.classList.toggle('lead', both && +y>+x);
    A.classList.toggle('trail', both && +x<+y); B.classList.toggle('trail', both && +y<+x);
  };
  sa.addEventListener('input', sync); sb.addEventListener('input', sync);
}
function closeModal(){
  const ov = $modalHost.firstElementChild;
  if(!ov || REDUCED){ $modalHost.innerHTML=''; return; }
  ov.classList.add('closing'); // quick slide-down, then remove
  setTimeout(()=>{ if(ov.parentNode===$modalHost) ov.remove(); }, 180);
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const h = document.getElementById('toastHost');
  let t = h.firstElementChild;
  if(!t){
    t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
    h.appendChild(t); void t.offsetWidth; // start from the hidden state so it transitions in
  }
  t.textContent = msg; // one persistent toast: a new message retargets, it never restarts
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- actions ---------- */
function doAction(action, el){
  switch(action){
    case 'setup-add': {
      const inp = document.getElementById('setupName');
      const n = inp.value.trim();
      if(n){ if(ui.setupNames.some(x=>x.n.toLowerCase()===n.toLowerCase())){ toast('Name already added'); } else ui.setupNames.push({n, lv:1}); }
      renderSetup(); const i2=document.getElementById('setupName'); i2.focus();
      return;
    }
    case 'setup-remove': ui.setupNames.splice(+el.dataset.i,1); renderSetup(); return;
    case 'setup-level': { const e = ui.setupNames[+el.dataset.i]; if(e){ e.lv = (e.lv%3)+1; renderSetup(); } return; }
    case 'cycle-level': {
      const p = byId(el.dataset.pid); if(!p) return;
      p.level = ((p.level||1)%3)+1; save(); render(); return;
    }
    case 'toggle-levelmatch':
      state.settings = state.settings||{};
      state.settings.levelMatch = !levelMatchOn(); save(); render();
      toast(levelMatchOn() ? 'Grouping by level' : 'Ignoring levels'); return;
    case 'setup-start': {
      if(ui.setupNames.length<4){ toast('Need at least 4 players'); return; }
      state = freshState(ui.setupNames, ui.setupCourts||1);
      fillCourts(); save(); window.scrollTo(0,0); render(); return;
    }
    case 'setup-courts':
      ui.setupCourts = Math.max(1, Math.min(12, (ui.setupCourts||1) + (+el.dataset.d)));
      renderSetup(); return;
    case 'tab': ui.tab = el.dataset.tab; ui.selected=null; render(); return;
    case 'shuffle': shuffleTeams(+el.dataset.court); save(); animatedRender(); return;
    case 'swap-teams':
      if(swapTeammates(+el.dataset.court)){ save(); animatedRender(); }
      else toast('🔗 Fixed partners stay together');
      return;
    case 'start':
      if(startMatch(+el.dataset.court)){ save(); render(); }
      else toast('Fill all 4 slots first');
      return;
    case 'fill-vacant': {
      if(!ui.selected){ toast('Tap a player first, then the open slot'); return; }
      if(placeVacant(ui.selected, +el.dataset.court, +el.dataset.team, +el.dataset.pos)){
        const n = nameOf(ui.selected); ui.selected=null; save(); animatedRender(); toast(`${n} is in`);
      } else { toast("Couldn't place there"); }
      return;
    }
    case 'finish': if(!finishing.has(+el.dataset.court)) openFinishModal(+el.dataset.court); return;
    case 'win': {
      const sa = document.getElementById('sa').value, sb = document.getElementById('sb').value;
      const cid = +el.dataset.court, w = +el.dataset.w;
      const SA = sa===''?null:+sa, SB = sb===''?null:+sb;
      if(SA!=null && SB!=null){
        if(SA===SB){ toast('Scores are tied. Fix the score or clear it.'); return; }
        if((SA>SB ? 0 : 1)!==w){ toast("That score says the other team won. Check the score."); return; }
      }
      closeModal();
      finishing.add(cid);
      const teamEl = document.querySelector(`.team[data-court="${cid}"][data-team="${w}"]`);
      const go = ()=>{ finishMatch(cid, w, SA, SB); finishing.delete(cid); save(); animatedRender(); };
      if(teamEl && !REDUCED){ teamEl.classList.add('winflash'); setTimeout(go, 300); } else go();
      return;
    }
    case 'modal-bg': if(event && event.target===el) closeModal(); return;
    case 'modal-close': closeModal(); return;
    case 'partner': openPartnerModal(el.dataset.pid); return;
    case 'set-partner': {
      const pid = el.dataset.pid, mate = el.dataset.mate;
      if(mate && byId(pid) && byId(pid).partnerId===mate){ setPartner(pid, null); }
      else setPartner(pid, mate || null);
      closeModal(); save(); render(); toast('Partners updated'); return;
    }
    case 'break': {
      if(!toggleBreak(el.dataset.pid)) toast('Sub them out of the court first');
      save(); animatedRender(); return;
    }
    case 'remove': {
      const p = byId(el.dataset.pid);
      if(p && confirm(`Remove ${p.name} from the session?`)){ removePlayer(p.id); save(); render(); }
      return;
    }
    case 'add-player': {
      const inputId = (el && el.dataset.input) || 'addName';
      const inp = document.getElementById(inputId); const n = inp.value.trim();
      if(!n){ inp.focus(); return; }
      if(state.players.some(x=>x.status!=='out' && x.name.toLowerCase()===n.toLowerCase())){ toast('Name already in session'); return; }
      const np = addPlayer(n); save(); animatedRender(); toast(np.late ? `${n} added · on the next court` : `${n} added to the queue`);
      const again = document.getElementById(inputId); if(again) again.focus(); // keep the keyboard up for the next name
      return;
    }
    case 'set-courts': {
      const want = Math.max(1, Math.min(12, state.courts.length + (+el.dataset.d)));
      setCourtCount(want); save(); animatedRender();
      if(state.courts.length>want) toast('Courts with players on them were kept');
      return;
    }
    case 'undo': if(undo()){ save(); animatedRender(); toast('Last result undone'); } return;
    case 'export-json':
      download('paddlecue-session-'+stamp()+'.json', JSON.stringify({...state, undoStack:[]}, null, 1), 'application/json');
      toast('Backup downloaded'); return;
    case 'export-txt':
      download('paddlecue-log-'+stamp()+'.txt', sessionAsText());
      toast('Log downloaded'); return;
    case 'restore': {
      const fi = document.getElementById('restoreFile');
      fi.onchange = () => {
        const f = fi.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = () => {
          try{
            const s = JSON.parse(r.result);
            if(!s || !Array.isArray(s.players) || !Array.isArray(s.courts)) throw 0;
            normalizeState(s);
            s.rev = Math.max(s.rev||0, (state && state.rev)||0); // keep live viewers in step
            state = s; save(); render(); toast('Session restored');
          }catch(e){ toast('Not a valid backup file'); }
        };
        r.readAsText(f);
      };
      fi.click(); return;
    }
    case 'live-start':
      if(!state.sid) state.sid = Math.random().toString(36).slice(2,10); // older saved sessions
      el.disabled = true;
      goLive().then(ok=>{ render(); if(ok){ toast("You're live"); openQrModal(); } });
      return;
    case 'live-stop':
      stopLive().then(()=>{ render(); toast('Live sharing stopped'); });
      return;
    case 'live-qr': openQrModal(); return;
    case 'live-share': {
      const url = liveLink();
      if(navigator.share){ navigator.share({title:'PaddleCue — live', url}).catch(()=>{}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('Link copied')); }
      return;
    }
    case 'live-copy':
      if(navigator.clipboard){ navigator.clipboard.writeText(liveLink()).then(()=>toast('Link copied')); }
      return;
    case 'finish-session': state.endedAt=Date.now(); state.screen='summary'; save(); render(); return;
    case 'resume-session': state.screen='main'; save(); render(); return;
    case 'share-summary': {
      const txt = shareText();
      if(navigator.share){ navigator.share({title:'PaddleCue open play', text:txt}).catch(()=>{}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Copied — paste it to the group chat')); }
      return;
    }
    case 'copy-summary':
      if(navigator.clipboard){ navigator.clipboard.writeText(shareText()).then(()=>toast('Summary copied')); }
      return;
    case 'new-session': {
      if(confirm('Start a fresh session? Current players, queue and match log will be cleared.' + (live.on ? ' Your live link stays the same.' : ''))){
        // the live room is kept on purpose: players' saved link shows the next session automatically
        localStorage.removeItem(LS_KEY); state=null; ui.setupNames=[]; ui.selected=null; ui.tab='play'; render();
      } return;
    }
  }
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(el){ doAction(el.dataset.action, el); return; }
});

/* ---------- tap-to-swap + drag ---------- */
function trySwap(aId, bId){
  const A=byId(aId), B=byId(bId);
  if(!A || !B) return;
  if(!findSlot(aId) && !findSlot(bId)){
    if(A.status==='queued' && B.status==='queued' && reorderQueue(aId, bId)){
      ui.selected=null; save(); animatedRender();
      toast(`${A.name} is now #${prioritySort(queuedPlayers()).findIndex(p=>p.id===aId)+1} in queue`);
    } else { toast("Can't move that player"); ui.selected=null; render(); }
    return;
  }
  if(swapPlayers(aId,bId)){ ui.selected=null; save(); animatedRender(); toast(`Swapped ${A.name} ↔ ${B.name}`); }
  else { toast('Pick one player on a court'); ui.selected=null; render(); }
}
/* Touch: a quick tap selects/swaps, a swipe scrolls the page as normal, and
   holding a name for a moment "lifts" it so it can be dragged. (Cards used to
   grab every touch, which made the page hard to scroll on a phone.)
   Mouse: drag starts as soon as the pointer moves. */
const LONG_PRESS = 220;
const GHOST_LIFT = 52; // on touch the dragged card floats this far above the thumb so it stays visible
let drag=null;
function liftCard(d){
  d.armed = true;
  d.vis.classList.remove('pressing'); d.vis.classList.add('lifting');
  buzz();
}
function releaseCard(d){ clearTimeout(d.timer); d.vis.classList.remove('pressing','lifting'); }
document.addEventListener('pointerdown', e=>{
  if(drag) return; // a second finger never hijacks a drag in progress
  const chip = e.target.closest('[data-chip]');
  if(!chip || e.button>0) return;
  // in the queue the whole row reacts, on court the card itself
  drag = { pid:chip.dataset.chip, x:e.clientX, y:e.clientY, el:chip, vis:chip.closest('.qitem')||chip,
           moved:false, ghost:null, armed:false, cancel:false, touch:e.pointerType!=='mouse' };
  if(!drag.touch){
    drag.armed = true; e.preventDefault();
    try{ chip.setPointerCapture(e.pointerId); }catch(err){} // keep the drag even if the mouse leaves the window
    return;
  }
  const d = drag;
  d.vis.classList.add('pressing'); // instant "I've got it" feedback
  d.timer = setTimeout(()=>{ if(drag===d && !d.cancel) liftCard(d); }, LONG_PRESS);
});
// once a card is lifted, stop the page from scrolling under the finger (bound per card in bindChipTouch)
function stopScrollWhileLifted(e){ if(drag && drag.armed) e.preventDefault(); }
document.addEventListener('contextmenu', e=>{ if(e.target.closest('[data-chip]')) e.preventDefault(); });
document.addEventListener('selectstart', e=>{ if(drag) e.preventDefault(); }); // never highlight text mid-gesture
document.addEventListener('pointercancel', ()=>{ // the browser took over (a scroll): forget the gesture
  if(!drag) return;
  releaseCard(drag);
  if(drag.ghost) drag.ghost.remove();
  clearDropHints(); drag = null;
});
/* where the card will land: the floating card's center on touch, the pointer on a mouse */
function dropPoint(d, e){ return { x:e.clientX, y:e.clientY - (d.touch ? GHOST_LIFT : 0) }; }
function dropTarget(x, y, pid){
  const under = document.elementFromPoint(x, y);
  if(!under) return null;
  const nearestChip = root => {
    const chips = [...root.querySelectorAll('[data-chip]')].filter(c=>c.dataset.chip!==pid);
    let best=null, bd=Infinity;
    for(const c of chips){
      const r=c.getBoundingClientRect();
      const d=Math.hypot(x-(r.left+r.width/2), y-(r.top+r.height/2));
      if(d<bd){ bd=d; best=c; }
    }
    return best;
  };
  const vac = under.closest('[data-vacant]');
  if(vac) return {type:'vacant', el:vac};
  const chip = under.closest('[data-chip]');
  if(chip) return chip.dataset.chip!==pid ? {type:'chip', el:chip} : null;
  const row = under.closest('.qitem');
  if(row){
    const c = row.querySelector('[data-chip]');
    return (c && c.dataset.chip!==pid) ? {type:'chip', el:c} : null;
  }
  const team = under.closest('.team');
  if(team){
    const slot = findSlot(pid);
    if(slot && team.dataset.court && slot.court.id===+team.dataset.court && slot.ti===+team.dataset.team) return null; // own team
    const v = team.querySelector('[data-vacant]');
    if(v) return {type:'vacant', el:v};
    const best = nearestChip(team);
    return best ? {type:'chip', el:best} : null;
  }
  const court = under.closest('.court');
  if(court){
    const slot = findSlot(pid);
    if(slot && court.querySelector(`[data-chip="${pid}"]`)) return null; // own court, ambiguous
    const v = court.querySelector('[data-vacant]');
    if(v) return {type:'vacant', el:v};
    const best = nearestChip(court);
    return best ? {type:'chip', el:best} : null;
  }
  const qc = under.closest('#queueCard');
  if(qc && findSlot(pid)) return {type:'queue', el:qc}; // court player -> bench (next up subs in)
  return null;
}
function clearDropHints(){
  document.querySelectorAll('.drophint').forEach(x=>x.classList.remove('drophint'));
  document.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('dropzone'));
}
document.addEventListener('pointermove', e=>{
  if(!drag || drag.cancel) return;
  const dx = Math.abs(e.clientX-drag.x), dy = Math.abs(e.clientY-drag.y), dist = Math.hypot(dx, dy);
  if(!drag.armed){
    // Names can't scroll sideways (touch-action: pan-y), so a sideways move can only
    // mean "drag": lift right away instead of making people wait out the hold.
    if(dx>8 && dx>dy){ clearTimeout(drag.timer); liftCard(drag); }
    else { // up/down before the hold finished: it's a scroll
      if(dist>10){ releaseCard(drag); drag.cancel = true; }
      return;
    }
  }
  if(!drag.moved && dist>6){
    drag.moved=true;
    const g = drag.el.cloneNode(true);
    g.classList.remove('lifting','pressing','sel'); g.classList.add('dragghost'); document.body.appendChild(g); drag.ghost=g;
  }
  if(drag.moved){
    e.preventDefault();
    // move the ghost with transform only (composited, no layout per frame); on touch it rides above the thumb
    const p = dropPoint(drag, e);
    drag.ghost.style.transform = `translate(${p.x-75}px, ${p.y-30}px)`;
    clearDropHints();
    const t = dropTarget(p.x, p.y, drag.pid);
    if(t) t.el.classList.add(t.type==='chip' ? 'drophint' : 'dropzone');
    drag.ghost.classList.toggle('benchhint', !t && !!findSlot(drag.pid));
  }
},{passive:false});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d=drag; drag=null;
  releaseCard(d);
  if(d.ghost) d.ghost.remove();
  clearDropHints();
  if(d.cancel) return; // that was a scroll
  if(d.moved){
    const p = dropPoint(d, e);
    const t = dropTarget(p.x, p.y, d.pid);
    if(t){
      if(t.type==='chip'){ trySwap(d.pid, t.el.dataset.chip); }
      else if(t.type==='vacant'){
        if(placeVacant(d.pid, +t.el.dataset.court, +t.el.dataset.team, +t.el.dataset.pos)){ ui.selected=null; save(); animatedRender(); toast(`${nameOf(d.pid)} is in`); }
      }
      else if(removeFromCourt(d.pid)){ save(); animatedRender(); toast(`${nameOf(d.pid)} back in queue — slot left open`); }
    } else if(findSlot(d.pid) && removeFromCourt(d.pid)){
      save(); animatedRender(); toast(`${nameOf(d.pid)} back in queue — slot left open`);
    }
  } else {
    // tap: select / swap
    const pid = d.pid;
    if(ui.selected && ui.selected!==pid){ trySwap(ui.selected, pid); }
    else if(ui.selected===pid){ ui.selected=null; render(); }
    else { ui.selected=pid; render(); toast(`${nameOf(pid)} selected · tap someone to swap`); }
  }
});

/* ---------- timers ---------- */
setInterval(()=>{
  document.querySelectorAll('.timer[data-start]').forEach(t=>{
    const s = Math.max(0, Math.floor((Date.now()-(+t.dataset.start))/1000));
    t.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  });
}, 1000);

/* ---------- boot ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js');
}
const vh = new URLSearchParams(location.hash.slice(1));
if(vh.get('r')){
  startViewer(vh.get('r'));
} else if(vh.get('live')){ // a link from before rooms existed
  IS_VIEWER = true; $tabs.classList.add('hidden');
  viewerMessage('This live link is from an older version.<br><span class="subtle">Ask the host to show their QR code again.</span>');
} else {
  load();
  if(!state){ state={screen:'setup'}; }
  render();
  resumeLive(); // pick up where the host left off (and renew a week-old room)
}
</script>
